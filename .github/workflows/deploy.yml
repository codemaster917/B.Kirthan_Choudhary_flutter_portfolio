name: Deploy Flutter Web to GitHub Pages

# Runs every time you push to the "main" branch, and can also be run
# manually from the "Actions" tab on GitHub.
on:
  push:
    branches:
      - master
  workflow_dispatch:

# Allow this workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deployment to run at a time.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        # The repository name is "kirthan_flutter_portfolio", so GitHub
        # Pages serves the site from /kirthan_flutter_portfolio/. The
        # --base-href flag tells Flutter Web to load its assets from
        # that same sub-path instead of the site root.
        run: flutter build web --release --base-href "/B.Kirthan_Choudhary_flutter_portfolio/"

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
